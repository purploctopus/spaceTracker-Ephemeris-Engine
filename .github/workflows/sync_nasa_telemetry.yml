name: Hourly NASA Ephemeris Sync Engine

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Source Repository
      uses: actions/checkout@v3

    - name: Initialize Cloud Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Execute NASA Horizons Extraction Script
      run: python fetch_ephemeris.py

    - name: Commit and Push Clean Data File
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add ephemeris.json
        git diff-index --quiet HEAD || git commit -m "🤖 Telemetry Core Update: Synced 1:1 with NASA Horizons [hourly]"
        git push

