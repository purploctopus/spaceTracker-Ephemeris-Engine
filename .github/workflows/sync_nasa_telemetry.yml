name: Hourly NASA Ephemeris Sync Engine

on:
  schedule:
    # ⏰ Cron schedule trigger: Fires precisely at minute 0 of every single hour!
    - cron: '19 * * * *'
  workflow_dispatch: # Allows you to trigger this update manually inside the GitHub interface

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the server write access to update the data file in your repo

    steps:
    - name: Checkout Source Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: main

    - name: Initialize Cloud Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Execute NASA Horizons Extraction Script
      run: python fetch_ephemeris.py

    - name: Commit and Push Clean Data File
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add ephemeris.json
        git diff-index --quiet HEAD || git commit -m "🤖 Telemetry Core Update: Synced 1:1 with NASA Horizons [hourly]"
        git push

